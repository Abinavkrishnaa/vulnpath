name: Publish

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v5
        with:
          enable-cache: false
      - run: uv build --all-packages --out-dir dist
      - name: Smoke-test the built wheels
        run: |
          uvx --from dist/vulnpath-*.whl \
              --with dist/vulnpath_schema-*.whl \
              vulnpath --version
      - name: Publish vulnpath-schema (dependency first)
        run: uv publish dist/vulnpath_schema-* --trusted-publishing always
      - name: Publish vulnpath
        run: uv publish dist/vulnpath-* --trusted-publishing always
