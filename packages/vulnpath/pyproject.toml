[project]
name = "vulnpath"
version = "0.1.0"
description = "Does your code actually call the vulnerable function? Evidence-backed vulnerability reachability for Python."
authors = [{ name = "Abinavkrishnaa R" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "vulnpath-schema>=0.1.0,<2",
    "packaging>=24.0",
    "typer>=0.12,<1",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["security", "vulnerability", "reachability", "sca", "static-analysis"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Abinavkrishnaa/vulnpath"
"Bug Tracker" = "https://github.com/Abinavkrishnaa/vulnpath/issues"
Changelog = "https://github.com/Abinavkrishnaa/vulnpath/releases"

[project.scripts]
vulnpath = "vulnpath.cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnpath"]
