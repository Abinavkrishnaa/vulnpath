[project]
name = "vulnpath-workspace"
version = "0"
description = "Workspace root for Vulnpath (not published)"
requires-python = ">=3.10"
dependencies = ["vulnpath", "vulnpath-schema"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vulnpath = { workspace = true }
vulnpath-schema = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "tomli>=2.0",  # lets mypy check the Python 3.10 branch
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/vulnpath/src", "packages/vulnpath-schema/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["vulnpath", "vulnpath_schema"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = ["packages/vulnpath/src", "packages/vulnpath-schema/src"]
packages = ["vulnpath", "vulnpath_schema"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages/vulnpath/tests", "packages/vulnpath-schema/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["vulnpath", "vulnpath_schema"]

[tool.coverage.report]
fail_under = 90
show_missing = true